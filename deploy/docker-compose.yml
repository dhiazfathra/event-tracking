services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: tracking
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    build:
      context: ..
      dockerfile: deploy/ingest.Dockerfile
    environment:
      CLICKHOUSE_ADDRS: clickhouse:9000
      CLICKHOUSE_DB: tracking
      POSTGRES_DSN: postgres://postgres:dev@postgres:5432/control
      REDIS_ADDR: redis:6379
      LISTEN_ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
    # The image is `distroless/static` — no shell, no curl, no wget, so a
    # `test: [CMD, ...]` healthcheck has nothing to exec. `up --wait` would
    # otherwise return as soon as the container starts, without ever checking
    # /readyz. CI polls /readyz itself instead (see the "Compose stack comes
    # up healthy" step below); a local `docker compose up` without --wait
    # doesn't need one either, since ingest logs its own readiness.
