version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/dhiazfathra/event-tracking/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.35.2
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/dart:v21.1.2
    out: gen/dart
